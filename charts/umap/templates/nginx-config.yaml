apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "umap.fullname" . }}-nginx-config
  labels:
    {{- include "umap.labels" . | nindent 4 }}
data:
  nginx.conf: |-
    {{- if .Values.nginx.config -}}
    {{ .Values.nginx.config | nindent 4 }}
    {{ else }}
    events {
        worker_connections  1024;  # Adjust this to your needs
    }

    http {
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        types {
          application/javascript mjs;
        }

        include       mime.types;
        default_type  application/octet-stream;
        sendfile        on;
        keepalive_timeout  65;

        # Server block
        server {
            listen       {{ .Values.nginx.service.port }};
            server_name  localhost;

            # Static file serving
            location /static/ {
                alias /static/;
                gzip on;
                gzip_vary on;
                gzip_proxied any;
                gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css;
                expires 365d;
                access_log /dev/null;
            }

            # Geojson files
            location /uploads/  {
                alias /data/;
                expires 30d;
            }

            location /favicon.ico {
                alias /static/favicon.ico;
            }

            # X-Accel-Redirect
            location /internal/ {
                internal;
                gzip_vary on;
                gzip_static on;
                add_header X-DataLayer-Version $upstream_http_x_datalayer_version;
                alias /data/;
            }

            # Proxy pass to ASGI server
            location / {
                proxy_pass http://localhost:{{ .Values.service.port }};
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_redirect off;
                proxy_buffering off;
            }
        }
    }
    {{ end }}

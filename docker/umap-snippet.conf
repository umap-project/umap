# Static file serving
location /static/ {
    alias /static/;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain application/javascript application/x-javascript text/javascript text/xml text/css;
    expires 365d;
    access_log /dev/null;
}

# Geojson files
location /uploads/  {
    alias /data/;
    expires 30d;
}

location /favicon.ico {
    alias /static/favicon.ico;
}

# X-Accel-Redirect
location /internal/ {
    internal;
    gzip_vary on;
    gzip_static on;
    add_header X-DataLayer-Version $upstream_http_x_datalayer_version;
    alias /data/;
}
